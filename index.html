 if(F.q){const q=F.q.toLowerCase();L=L.filter(b=>(b.title+au(b)+b.isbn+cn(b)).toLowerCase().includes(q))}
 if(mode==='new')L.sort((a,b)=>b.added.localeCompare(a.added));
 if(mode==='pop')L.sort((a,b)=>pop(b.id)-pop(a.id));
 if(mode==='avail')L=L.filter(b=>avail(b)>0);
 if(mode==='ebook')L=L.filter(b=>b.ebook);return L}
function bl(){const el=$('#bl');if(!el)return;const L=blist(el.dataset.m);
